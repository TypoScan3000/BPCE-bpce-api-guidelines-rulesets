formats: ["arazzo1_0"]

extends: "spectral:arazzo"

rules:
  info-version-arazzo1:
    description: "Arazzo Version must comply with SemVer practices"
    severity: error
    given: $.info.version
    recommended: true
    message: "{{description}} ({{path}})"
    then:
      function: pattern
      functionOptions:
        match: "^(0|[1-9][0-9]*).(0|[1-9][0-9]*).(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)?(.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?('+'([0-9a-zA-Z-]+(.[0-9a-zA-Z-]+)*))?$"
