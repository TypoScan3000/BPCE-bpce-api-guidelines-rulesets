extends:
  - [spectral:oas, off]

formats: [oas2, oas3]

aliases:
  NumberDefinition:
    - '$..[?(@ && @.type=="number")]'
  IntegerDefinition:
    - '$..[?(@ && @.type=="integer")]'
  StringDefinition:
    - '$..[?(@ && @.type=="string")]'
  ArrayDefinition:
    - '$..[?(@ && @.type=="array")]'
  BooleanDefinition:
    - '$..[?(@ && @.type=="boolean")]'

rules:
  # Two rules inherited from spectral applicable to datatypes that we set to error level
  duplicated-entry-in-enum: error

  typed-enum: error

  datatypes-boolean-must-not-be-nullable:
    description: "Boolean element must not be nullable"
    severity: error
    recommended: true
    extensions:
      justification: Semantically, a boolean can only take two possible values.
      since: 2024-07-10
      tags:
        - style
        - datatypes
        - boolean
    given: "#BooleanDefinition"
    message: "boolean element {{path}} must not have have a nullable field"
    then:
      field: nullable
      function: falsy

  datatypes-boolean-must-begin-with-is:
    description: "Boolean name must begin with  `is`, `has` or `can`"
    severity: error
    recommended: true
    extensions:
      justification: A boolean property named beginning with `is`, `has` or `can` is more readable. Proper lowerCamelCase capitalization is required.
      since: 2024-07-25
      tags:
        - style
        - datatypes
        - boolean
    given: '$..properties..[?(@ && @.type=="boolean")]~'
    message: "boolean element {{path}} name must begin with `is`, `has` or `can`"
    then:
      function: pattern
      functionOptions:
        match: "^(is[A-Z]|has[A-Z]|can[A-Z])"

  datatypes-boolean-must-not-end-with-indicator:
    description: "Boolean name must not end with `indicator`"
    severity: error
    recommended: true
    extensions:
      justification: A boolean property named beginning with `is`, `has` or `can` is more readable. Adding 'indicator' in the end does not provide any added value.
      since: 2024-07-25
      tags:
        - style
        - datatypes
        - boolean
    given: '$..properties..[?(@ && @.type=="boolean")]~'
    message: "boolean element {{path}} name must not end with 'indicator' "
    then:
      function: pattern
      functionOptions:
        notMatch: "(I|i)ndicator$"

  datatypes-datetype-must-end-with-date:
    description: "Date property name must end with `Date`"
    severity: error
    recommended: true
    extensions:
      justification: Consistency between property name and type improves readability.
      since: 2024-07-25
      tags:
        - style
        - datatypes
        - date
    given: '$..properties..[?(@ && @.type=="string" && @.format=="date")]~'
    message: "Property {{path}} name must end with `Date`"
    then:
      function: pattern
      functionOptions:
        match: "(Date$)|(^dateOfBirth$)|(^date$)"

  datatypes-datetype-must-have-date-format:
    description: "Type inference from example implies date format"
    severity: error
    recommended: true
    extensions:
      justification: Datatype quality implies that all date fields be actually declared as such.
      since: 2024-07-25
      tags:
        - style
        - datatypes
        - date
    given: '$..properties..[?(@ && @.type=="string" && (!@.format || @.format!="date") && @.example)]'
    message: "Example {{path}} type inference implies date format"
    then:
      - field: example
        function: pattern
        functionOptions:
          notMatch: "(^[1-2][0-9]{3}(-)?[0-1][0-9](-)?[0-3][0-9]$)|(^[1-3][0-9]\/[0-1][0-9]\/[1-2][0-9]{3}$)"

  datatypes-datetimetype-must-end-with-datetime:
    description: "Datetime property name must end with `Datetime`"
    severity: error
    recommended: true
    extensions:
      justification: Consistency between property name and type improves readability.
      since: 2024-07-25
      tags:
        - style
        - datatypes
        - datetime
    given: '$..properties..[?(@ && @.type=="string" && @.format=="date-time")]~'
    message: "Property {{path}} name must end with `DateTime`"
    then:
      function: pattern
      functionOptions:
        match: "(DateTime$)|(^dateTime$)"

  # The rule below is designed with a JSONPath targeting schema properties only,
  # excluding enumerations which typically appear in server variables.
  datatypes-upper-case-enums:
    description: Enums should be written in UPPERCASE separated by underscores.
    recommended: true
    severity: warn
    extensions:
      justification: Enumeration values are more easily identifiable with a consistent naming scheme. There are notable exceptions, such as the language codes from ISO 639-1 or sort orders which explain why this rule is only flagged as a warning.
      since: 2024-01-01
      tags:
        - style
        - datatypes
        - enumerations
    given:
      - "$.paths.*.*..schema..properties..[?(@ && @.type=='string')].enum.*"
      - "$..[?(@ && @.type=='string')].enum.*"
    then:
      - function: pattern
        functionOptions:
          match: "^[A-Z0-9_]+$"

  datatypes-missing-integer-format:
    description: Format must be specified for an integer property.
    severity: error
    extensions:
      justification: Integer properties without a format may be mapped differently by developers, creating potential bugs or typecast errors.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given: "$.paths.*.*..schema..properties..[?(@ && @.type=='integer')]"
    then:
      field: format
      function: defined

  datatypes-missing-number-format:
    description: Format must be specified for a number property.
    severity: error
    extensions:
      justification: Number properties without a format may be mapped differently by developers, creating potential bugs or typecast errors.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given: "$.paths.*.*..schema..properties..[?(@ && @.type=='number')]"
    then:
      field: format
      function: defined

  datatypes-incorrect-integer-format:
    description: Incorrect integer format - Must be one of int32, int64.
    severity: error
    extensions:
      justification: Any value other than int32 or int64 will be silently ignored, leading to potential bugs or typecast errors.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given: "#IntegerDefinition"
    then:
      field: format
      function: enumeration
      functionOptions:
        values:
          - int32
          - int64

  datatypes-incorrect-number-format:
    description: Incorrect number format - Must be one of float, double.
    severity: error
    extensions:
      justification: Any value other than float or double will be silently ignored, leading to potential bugs or typecast errors.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given: "#NumberDefinition"
    then:
      field: format
      function: enumeration
      functionOptions:
        values:
          - float
          - double

  datatypes-incorrect-string-format:
    description: Incorrect string format.
    severity: error
    extensions:
      justification: The list of allowed string formats is restricted to avoid typos and mistakes which would lead to ignored constraints.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given: "#StringDefinition"
    then:
      field: format
      function: enumeration
      functionOptions:
        values:
          - date-time
          - date
          - time
          - duration
          - email
          - binary
          - byte
          - password
          - uuid
          - uri
          - uri-reference

  datatypes-illegal-numeric-qualifier:
    description: Illegal numeric qualifier - minimum and maximum can only be used on numbers/integers.
    severity: error
    extensions:
      justification: There is no built-in integrity check to ensure that minimum, maximum, exclusiveMinimum are applied correctly.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given:
      - "#StringDefinition"
      - "#ArrayDefinition"
    then:
      - field: minimum
        function: undefined
      - field: maximum
        function: undefined
      - field: exclusiveMinimum
        function: undefined
      - field: exclusiveMaximum
        function: undefined

  datatypes-illegal-string-qualifier:
    description: Illegal string qualifier - minLength, maxLength and pattern can only be used on strings.
    severity: error
    extensions:
      justification: There is no built-in integrity check to ensure that minLength, maxLength and pattern are applied correctly.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given:
      - "#NumberDefinition"
      - "#IntegerDefinition"
      - "#ArrayDefinition"
    then:
      - field: minLength
        function: undefined
      - field: maxLength
        function: undefined
      - field: pattern
        function: undefined

  datatypes-illegal-array-qualifier:
    description: Illegal array qualifier - minItems, maxItems and uniqueItems can only be used on arrays.
    severity: error
    extensions:
      justification: There is no built-in integrity check to ensure that minItems and maxItems are applied correctly to arrays.
      since: 2024-01-01
      tags:
        - datatypes
        - integrity
    given:
      - "#NumberDefinition"
      - "#IntegerDefinition"
      - "#StringDefinition"
    then:
      - field: minItems
        function: undefined
      - field: maxItems
        function: undefined
      - field: uniqueItems
        function: undefined

  datatypes-illegal-array-decoration:
    description: A schema of type array cannot declare 'required' or 'format'.
    severity: error
    extensions:
      justification: There is no built-in integrity check to ensure that a schema of type array does not define illegal properties.
      since: 2025-07-30
      tags:
        - datatypes
        - integrity
    given:
      - "#ArrayDefinition"
    then:
      - field: required
        function: undefined
      - field: format
        function: undefined

  datatypes-invalid-array-declaration:
    description: A schema of type array must declare its contents with the items attribute.
    severity: error
    extensions:
      justification: There is no built-in integrity check to ensure that a schema of type array does define items.
      since: 2025-11-12
      tags:
        - datatypes
        - integrity
    given:
      - "#ArrayDefinition"
    then:
      - field: items
        function: defined

  datatypes-illegal-string-decoration-oas2:
    description: A schema of type string cannot declare 'required'.
    severity: error
    formats:
      - oas2
    extensions:
      justification: There is no built-in integrity check to ensure that a schema of type string does not define illegal properties.
      since: 2025-07-30
      tags:
        - datatypes
        - integrity
    given:
      - "#StringDefinition"
    then:
      - function: schema
        functionOptions:
          ## When a string type is encountered in a Swagger2 contract, it can be a
          ## parameter, in which case the required tag may be set to true, or it can be a normal schema declaration,
          ## and in this case the presence of a required array is a violation of the spec.
          ## the function below should therefore be read as 'if there is a required attribute on a string definition, it cannot be declared as an array'
          schema:
            additionalProperties: true
            not:
              properties:
                required:
                  type: array
              required:
                - required

  datatypes-illegal-string-decoration-oas3:
    description: A schema of type string cannot declare 'required'.
    severity: error
    formats:
      - oas3
    extensions:
      justification: There is no built-in integrity check to ensure that a schema of type string does not define illegal properties.
      since: 2025-07-30
      tags:
        - datatypes
        - integrity
    given:
      - "#StringDefinition"
    then:
      - field: required
        function: undefined
