formats: [oas2, oas3]

aliases:
  Basepath:
    - $.basePath # oas2
    - $.servers.*.url # oas3

rules:
  basepath-defined-oas2:
    formats: ["oas2"]
    recommended: true
    description: Base path must be defined in basePath
    message: "{{description}} (#/basePath) {{path}}"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "A base path has to be defined so that the try-out and production usages can operate normally."
      tags:
        - basepath
    given: $
    then:
      field: basePath
      function: truthy

  basepath-defined-oas3:
    formats: ["oas3"]
    recommended: true
    description: Base path must be defined in at least a server in servers
    message: "{{description}} (#/servers)  {{path}}"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "A base path has to be defined so that the try-out and production usages can operate normally."
      tags:
        - basepath
    given: $
    then:
      - field: servers
        function: truthy
      - field: servers
        function: length
        functionOptions:
          min: 1

  basepath-valid-structure:
    recommended: true
    description: Base path structure must end with `/apiName/version`, for example `/someName/v2`
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "This is to ensure that versioning is global and not at the resource level."
      tags:
        - basepath
        - versioning
    given: "#Basepath"
    then:
      function: pattern
      functionOptions:
        match: "\/[a-z]+\/(v)[0-9]+$/i"

  basepath-lowerCamelCased:
    recommended: true
    description: Base path must be in lowerCamelCase, for example `/someName/v2`
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "Most, if not all BPCE style guides are lowerCamelCase based."
      tags:
        - basepath
        - style
    given: "#Basepath"
    then:
      function: pattern
      functionOptions:
        # added / use case to avoid having it trigger this rule
        # added {} to support variables in the server basepath expression
        match: "(^\/$)|(^(https?:\/\/[a-zA-Z0-9_.:{}]+)?(\/[a-z0-9{}]+([A-Z0-9{}][a-z0-9{}]+)*)+$)"

  basepath-no-trailing-slash:
    recommended: true
    description: Basepath must not end with trailing slash
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "The OAS spec mandates that paths must start with a slash, so basepath must not end with slash. The combination would cause issues."
      tags:
        - basepath
    given: "#Basepath"
    then:
      function: pattern
      functionOptions:
        notMatch: "\\/$"

  basepath-no-api:
    recommended: true
    description: Basepath should not contain 'api'
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "There is no need to waste size in basepath by adding redundant or useless sections."
      tags:
        - basepath
    given: "#Basepath"
    then:
      function: pattern
      functionOptions:
        notMatch: "/^.*api.*$/i"

  basepath-not-in-path:
    recommended: true
    description: Path must not begin with base path elements like api name and version
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "This is to ensure that versioning is global and not at the resource level."
      tags:
        - basepath
        - versioning
        - path
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "^\/[a-zA-Z0-9_-]+\/(v|V)[0-9]+.*$"

  basepath-version-not-in-path:
    recommended: true
    description: Version must be in base path and not in path
    message: "{{description}} ({{path}})"
    severity: error
    extensions:
      since: 2024-01-01
      justification: "This is to ensure that versioning is global and not at the resource level."
      tags:
        - basepath
        - versioning
        - path
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "(v|V)[0-9]+"
